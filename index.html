        const { useState, useEffect, useRef } = React;

        // --- Helper to parse very basic markdown ---
        function parseMessageMarkdown(text) {
            let html = text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-brand underline hover:text-brand-dark">$1</a>')
                .replace(/\n/g, '<br>');
            const lines = html.split('<br>');
            let inList = false;
            let result = '';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                const isListItem = line.trim().startsWith('- ') || line.trim().startsWith('* ');

                if (isListItem) {
                    if (!inList) { result += '<ul>'; inList = true; }
                    result += `<li>${line.trim().substring(2)}</li>`;
                } else {
                    if (inList) { result += '</ul>'; inList = false; }
                    if (line.trim() !== '') result += `<p>${line}</p>`;
                }
            }
            if (inList) result += '</ul>';
            if (result === '') result = `<p>${html}</p>`;
            return { __html: result };
        }

        function ChatbotDemo() {
            const [messages, setMessages] = useState([
                { role: 'ai', content: "Namaste! I am your KrishiSahay assistant. Ask me anything about your farm or crops." }
            ]);
            const [input, setInput] = useState("");
            const [loading, setLoading] = useState(false);
            const [language, setLanguage] = useState("en");
            const [weatherData, setWeatherData] = useState({ temp: null, desc: "", location: "" });
            const [weatherLoading, setWeatherLoading] = useState(true);
            const [isRecording, setIsRecording] = useState(false);
            const [selectedImage, setSelectedImage] = useState(null);
            const [imagePreview, setImagePreview] = useState(null);
            const fileInputRef = useRef(null);
            const chatEndRef = useRef(null);
            const [showSettings, setShowSettings] = useState(false);

            useEffect(() => {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        async (position) => {
                            try {
                                const lat = position.coords.latitude;
                                const lon = position.coords.longitude;
                                const res = await fetch(`/api/weather?lat=${lat}&lon=${lon}`);
                                if (res.ok) {
                                    const data = await res.json();
                                    setWeatherData({
                                        temp: data.temperature,
                                        desc: data.description,
                                        location: data.location
                                    });
                                }
                            } catch (error) {
                                console.error("Weather fetch error", error);
                            } finally {
                                setWeatherLoading(false);
                            }
                        },
                        (error) => {
                            console.warn("Geolocation error", error);
                            setWeatherLoading(false);
                        },
                        { timeout: 10000 }
                    );
                } else {
                    setWeatherLoading(false);
                }
            }, []);

            const scrollToBottom = () => {
                if (chatEndRef.current && chatEndRef.current.parentNode) {
                    const container = chatEndRef.current.parentNode;
                    container.scrollTop = container.scrollHeight;
                }
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            // Adjust body class for font styling when language changes
            useEffect(() => {
                document.body.className = `lang-${language} font-sans text-gray-800`;
            }, [language]);

            // Voice Recognition Logic
            const recognitionRef = useRef(null);

            const handleMicClick = () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert("Your browser does not support voice input. Please try using Google Chrome or Microsoft Edge.");
                    return;
                }

                if (isRecording) {
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch (e) { }
                    }
                    setIsRecording(false);
                    return;
                }

                const recognition = new SpeechRecognition();
                recognitionRef.current = recognition;

                if (language === 'hi') recognition.lang = 'hi-IN';
                else if (language === 'te') recognition.lang = 'te-IN';
                else recognition.lang = 'en-US';

                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = () => {
                    setIsRecording(true);
                };

                recognition.onresult = (event) => {
                    let finalTranscript = '';
                    for (let i = event.resultIndex; i < event.results.length; ++i) {
                        if (event.results[i].isFinal) {
                            finalTranscript += event.results[i][0].transcript;
                        }
                    }
                    if (finalTranscript) {
                        setInput(prev => prev + (prev.length > 0 ? " " : "") + finalTranscript);
                    }
                };

                recognition.onerror = (event) => {
                    console.error("Speech recognition error:", event.error);
                    if (event.error === 'not-allowed') {
                        alert("Microphone access blocked. Please allow mic permissions in your browser address bar.");
                    } else if (event.error === 'audio-capture') {
                        alert("No microphone found! Please check if your microphone is properly plugged in, or check Windows Settings -> Privacy -> Microphone to ensure apps are allowed to access it.");
                    } else if (event.error === 'no-speech') {
                        // Just silently handle if they didn't speak
                    } else {
                        alert("Voice input error: " + event.error);
                    }
                    setIsRecording(false);
                };

                recognition.onend = () => {
                    setIsRecording(false);
                };

                recognition.onnomatch = () => {
                    setIsRecording(false);
                };

                try {
                    recognition.start();
                } catch (e) {
                    setIsRecording(false);
                }
            };

            // Image Upload Logic
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 5 * 1024 * 1024) {
                        alert("Image size should be less than 5MB");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSelectedImage(reader.result); // Base64 string
                        setImagePreview(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const clearImage = () => {
                setSelectedImage(null);
                setImagePreview(null);
                if (fileInputRef.current) fileInputRef.current.value = "";
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if ((!input.trim() && !selectedImage) || loading) return;

                const userQuery = input.trim();

                // Add message to UI
                let contentHtml = userQuery;
                if (imagePreview) {
                    contentHtml = `<img src="${imagePreview}" class="max-w-[200px] max-h-[200px] rounded-lg mb-2 border border-brand/20 shadow-sm" alt="Uploaded Image" /><br/>` + contentHtml;
                }
                setMessages(prev => [...prev, { role: 'user', content: contentHtml, isHtml: true }]);

                setInput("");
                const imageToSend = selectedImage; // Keep local ref for this request
                clearImage(); // Clear UI
                setLoading(true);

                try {
                    // Call the Flask Backend
                    const response = await fetch('/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            query: userQuery,
                            image: imageToSend,
                            weather: weatherData.desc || "Unknown",
                            location: weatherData.location || "Unknown",
                            language: language
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        setMessages(prev => [...prev, { role: 'ai', content: data.response }]);
                    } else {
                        setMessages(prev => [...prev, { role: 'ai', content: "Error connecting to service." }]);
                    }
                } catch (error) {
                    setMessages(prev => [...prev, { role: 'ai', content: "Network error. Make sure the backend server (app.py) is running." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <section id="demo" className="py-16 bg-slate-50 border-t border-gray-100">
                    <div className="max-w-5xl mx-auto px-4">
                        <div className="text-center mb-8">
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">Try the KrishiSahay Chatbot</h2>
                            <p className="text-gray-600 text-sm mb-6">Experience our AI-powered agricultural logic.</p>

                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8 items-start relative z-10">
                            <div className="md:col-span-2 relative">
                                {/* Decorative elements behind chat */}
                                <div className="absolute -top-10 -left-10 w-40 h-40 bg-brand-light/30 rounded-full blur-3xl -z-10"></div>
                                <div className="absolute -bottom-10 -right-10 w-40 h-40 bg-yellow-300/20 rounded-full blur-3xl -z-10"></div>

                                <div className="bg-white/90 backdrop-blur-xl rounded-3xl overflow-hidden flex flex-col h-[550px] border border-white shadow-[0_20px_60px_-15px_rgba(0,0,0,0.1)] ring-1 ring-black/5 w-full relative">
                                    {/* Chat Header */}
                                    <div className="bg-gradient-to-r from-brand to-[#118A3E] px-6 py-4 flex justify-between items-center shadow-md relative z-20">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 bg-white shadow-inner text-brand rounded-full flex items-center justify-center text-lg shadow-lg relative">
                                                <i className="fa-solid fa-leaf"></i>
                                                <span className="absolute bottom-0 right-0 w-3 h-3 bg-green-400 border-2 border-white rounded-full animate-pulse shadow-[0_0_10px_rgba(74,222,128,0.8)]"></span>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-white text-base drop-shadow-sm">KrishiSahay AI</h3>
                                                <p className="text-xs text-brand-light font-medium tracking-wide">Intelligent Farm Assistant</p>
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-3 text-white/90">
                                            {/* Visible Language Selector */}
                                            <div className="flex bg-black/20 rounded-lg p-1 backdrop-blur-sm border border-white/10 shadow-inner">
                                                <button
                                                    onClick={() => setLanguage('en')}
                                                    className={`px-3 py-1 text-xs font-semibold rounded-md transition-all ${language === 'en' ? 'bg-white text-brand shadow-sm' : 'hover:bg-white/10'}`}
                                                >
                                                    English
                                                </button>
                                                <button
                                                    onClick={() => setLanguage('hi')}
                                                    className={`px-3 py-1 text-xs font-semibold rounded-md transition-all ${language === 'en' ? 'hover:bg-white/10' : (language === 'hi' ? 'bg-white text-brand shadow-sm' : 'hover:bg-white/10')}`}
                                                >
                                                    हिन्दी
                                                </button>
                                                <button
                                                    onClick={() => setLanguage('te')}
                                                    className={`px-3 py-1 text-xs font-semibold rounded-md transition-all ${language === 'en' || language === 'hi' ? 'hover:bg-white/10' : 'bg-white text-brand shadow-sm'}`}
                                                >
                                                    తెలుగు
                                                </button>
                                            </div>

                                            <div className="w-px h-5 bg-white/20 mx-1"></div>

                                            <button onClick={() => setMessages([{ role: 'ai', content: "Namaste! I am your KrishiSahay assistant. Ask me anything about your farm or crops." }])} className="w-8 h-8 rounded-full hover:bg-white/20 flex items-center justify-center transition" title="Clear Chat">
                                                <i className="fa-solid fa-trash-can text-sm"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Messages */}
                                    <div className="flex-grow p-6 overflow-y-auto chat-container flex flex-col gap-5 bg-[#FAFAF8] relative pb-24 shadow-inner">
                                        <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.03] pointer-events-none"></div>

                                        <div className="text-center w-full my-2">
                                            <span className="text-[10px] font-semibold tracking-widest text-gray-400 uppercase bg-gray-100/50 px-3 py-1 rounded-full border border-gray-200/50">Today</span>
                                        </div>

                                        {messages.map((msg, idx) => (
                                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-message-pop relative z-10 w-full group`} style={{ opacity: 0, animationDelay: `${Math.min(idx * 0.1, 0.5)}s` }}>
                                                {msg.role === 'ai' && (
                                                    <div className="w-6 h-6 rounded-full bg-brand-light/20 text-brand flex items-center justify-center text-[10px] shrink-0 mr-2 mt-1 self-start shadow-sm border border-brand/10">
                                                        <i className="fa-solid fa-leaf"></i>
                                                    </div>
                                                )}
                                                <div className={`max-w-[75%] px-5 py-3.5 rounded-2xl text-[15px] leading-relaxed shadow-sm transition-all duration-300 group-hover:shadow-md ${msg.role === 'user'
                                                    ? 'bg-gradient-to-br from-[#16a34a] to-[#14532d] text-white rounded-tr-sm border border-[#14532d]/20 relative z-20'
                                                    : 'bg-white border border-gray-100/80 text-gray-700 rounded-tl-sm prose prose-sm prose-p:leading-relaxed prose-a:text-brand prose-a:font-semibold'
                                                    }`}
                                                    dangerouslySetInnerHTML={msg.role === 'user' && !msg.isHtml ? undefined : (msg.isHtml ? { __html: msg.content } : parseMessageMarkdown(msg.content))}>
                                                    {msg.role === 'user' && !msg.isHtml ? msg.content : undefined}
                                                </div>
                                            </div>
                                        ))}
                                        {loading && (
                                            <div className="flex justify-start relative z-10">
                                                <div className="w-6 h-6 rounded-full bg-brand-light/20 text-brand flex items-center justify-center text-[10px] shrink-0 mr-2 mt-1 self-start shadow-sm border border-brand/10">
                                                    <i className="fa-solid fa-leaf"></i>
                                                </div>
                                                <div className="bg-white shadow-sm border border-gray-100 text-gray-800 rounded-2xl rounded-tl-sm px-5 py-4 flex gap-2 items-center">
                                                    <div className="w-2 h-2 bg-brand rounded-full animate-bounce"></div>
                                                    <div className="w-2 h-2 bg-brand/70 rounded-full animate-bounce" style={{ "animationDelay": "0.15s" }}></div>
                                                    <div className="w-2 h-2 bg-brand/40 rounded-full animate-bounce" style={{ "animationDelay": "0.3s" }}></div>
                                                </div>
                                            </div>
                                        )}
                                        <div ref={chatEndRef} />
                                    </div>

                                    {/* Floating Input Area */}
                                    <div className="absolute bottom-5 left-5 right-5 z-30">
                                        <div className="bg-white/80 backdrop-blur-xl p-2 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/60 flex flex-col ring-1 ring-black/5">
                                            {/* Image Preview Area */}
                                            {imagePreview && (
                                                <div className="mb-2 ml-4 mt-2 relative inline-block self-start">
                                                    <img src={imagePreview} alt="Preview" className="h-16 w-auto rounded-xl border-2 border-brand/30 shadow-sm" />
                                                    <button onClick={clearImage} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] hover:bg-red-600 shadow-sm transition-transform hover:scale-110">
                                                        <i className="fa-solid fa-times"></i>
                                                    </button>
                                                </div>
                                            )}

                                            <form onSubmit={handleSubmit} className="flex gap-2 items-center">
                                                <div className="flex-grow flex items-center bg-transparent px-3 py-1">
                                                    {/* Hidden File Input */}
                                                    <input
                                                        type="file"
                                                        accept="image/*"
                                                        className="hidden"
                                                        ref={fileInputRef}
                                                        onChange={handleImageChange}
                                                    />

                                                    {/* Camera Button */}
                                                    <button
                                                        type="button"
                                                        onClick={() => fileInputRef.current?.click()}
                                                        className={`w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:text-brand hover:bg-brand/10 transition-colors shrink-0 ${imagePreview ? 'text-brand bg-brand/10' : ''}`}
                                                        title="Upload Image"
                                                    >
                                                        <i className="fa-solid fa-image text-lg hover:scale-110 transition-transform"></i>
                                                    </button>

                                                    <input
                                                        type="text"
                                                        value={input}
                                                        onChange={(e) => setInput(e.target.value)}
                                                        placeholder={isRecording ? "Listening..." : "Ask KrishiSahay..."}
                                                        className={`flex-grow px-4 py-2 bg-transparent text-[15px] focus:outline-none placeholder-gray-400 ${isRecording ? 'text-red-500 placeholder-red-400 font-medium' : 'text-gray-700'}`}
                                                    />

                                                    {/* Mic Button */}
                                                    <button
                                                        type="button"
                                                        onClick={handleMicClick}
                                                        className={`w-10 h-10 rounded-full flex items-center justify-center transition-all shrink-0 ${isRecording ? 'text-red-500 bg-red-50 ring-1 ring-red-200 animate-pulse' : 'text-gray-500 hover:text-brand hover:bg-brand/10'}`}
                                                        title="Voice Input"
                                                    >
                                                        <i className={`fa-solid text-lg ${isRecording ? 'fa-microphone-lines scale-110' : 'fa-microphone hover:scale-110 transition-transform'}`}></i>
                                                    </button>
                                                </div>

                                                <button
                                                    type="submit"
                                                    disabled={loading || (!input.trim() && !imagePreview)}
                                                    className="w-12 h-12 bg-gradient-to-br from-brand to-[#118A3E] hover:from-brand-dark hover:to-brand text-white rounded-full transition-all flex items-center justify-center disabled:opacity-30 disabled:cursor-not-allowed cursor-pointer shadow-[0_4px_14px_0_rgba(22,163,74,0.39)] hover:shadow-[0_6px_20px_rgba(22,163,74,0.23)] hover:-translate-y-0.5 shrink-0 group mr-1"
                                                >
                                                    <i className="fa-solid fa-arrow-up text-lg group-hover:-translate-y-1 transition-transform"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="md:col-span-1 h-full hidden md:block flex flex-col z-20">
                                {/* Weather Widget */}
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-left mb-6 relative">
                                    <h3 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                        <i className="fa-solid fa-cloud-sun text-brand"></i>
                                        Local Weather
                                    </h3>
                                    {weatherLoading ? (
                                        <div className="flex items-center gap-2 text-gray-500 text-sm">
                                            <i className="fa-solid fa-spinner fa-spin"></i> Fetching location...
                                        </div>
                                    ) : weatherData.temp !== null ? (
                                        <div>
                                            <div className="flex items-center gap-3 mb-2">
                                                <div className="text-4xl font-bold text-gray-800">{Math.round(weatherData.temp)}&deg;C</div>
                                                <div className="text-3xl text-brand"><i className="fa-solid fa-temperature-half"></i></div>
                                            </div>
                                            <div className="text-sm font-medium text-gray-700 capitalize mb-2">{weatherData.desc}</div>
                                            <div className="text-xs text-gray-500 flex items-center gap-1">
                                                <i className="fa-solid fa-location-dot text-red-400"></i> {weatherData.location}
                                            </div>
                                        </div>
                                    ) : (
                                        <p className="text-gray-500 text-sm">
                                            <i className="fa-solid fa-location-crosshairs"></i> Location unavailable.
                                        </p>
                                    )}
                                </div>
                                <div className="relative"><HowItWorksSidebar /></div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        }

        function App() {
            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <Navbar />
                    <main className="flex-grow">
                        <Hero />
                        <About />
                        <ChatbotDemo />
                        <SupplyStoreAndSchemes />
                        <Features />
                    </main>
                    {/* Excluded Footer */}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>

</html>
